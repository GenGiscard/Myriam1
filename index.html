<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'atelier de Pépin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout : écran projeté — barre haute, grande scène centrale, Pépin commente dans une bulle. Un seul look clair, pensé pour le vidéoprojecteur. */
:root{
  --bg:#E4F0FF; --bg2:#CFE2FA; --ink:#1A2347; --soft:#4E5C86; --card:#FFFFFF; --line:#B9CDEB;
  --t6:#FF7A1A; --t6d:#B84A00; --t6l:#FFE3CC;
  --t5:#7C4DFF; --t5d:#4F22D0; --t5l:#E6DCFF;
  --ok:#0E9E6E; --okl:#D2F5E7; --ko:#E5394F; --kol:#FFDDE2; --pep:#FFC93C;
  --chr:#2F68E8; --jud:#8E44C9; --isl:#0E9E6E; --hin:#E8641A; --bou:#C79A00;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:clamp(17px,1.45vw,26px);line-height:1.35;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px;
  background-image:radial-gradient(circle at 12% 18%,#fff8 0 60px,transparent 61px),radial-gradient(circle at 88% 8%,#fff6 0 90px,transparent 91px);}
h1,h2,h3,.disp{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.wrap{max-width:1400px;margin:0 auto}
/* barre */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:12px;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.bar .ttl{flex:1;min-width:0;font-family:var(--display);font-weight:600;font-size:1.25em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:3px solid var(--ink);background:var(--card);border-radius:14px;padding:.35em .8em;font-family:var(--display);font-weight:600;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.big{font-size:1.15em;padding:.5em 1.1em}
.btn.p6{background:var(--t6);color:#fff;border-color:var(--t6d);box-shadow:0 4px 0 var(--t6d)}
.btn.p5{background:var(--t5);color:#fff;border-color:var(--t5d);box-shadow:0 4px 0 var(--t5d)}
.btn.sm{font-size:.8em;padding:.25em .6em}
/* Pépin */
.pep{width:100%;height:auto;display:block;overflow:visible}
.pep .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hop{animation:hop .6s ease 2}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-26px) rotate(-6deg)}}
.buddy{display:flex;align-items:flex-end;gap:14px;margin-block:10px 18px}
.buddy .pw{width:clamp(80px,8vw,130px);flex:none}
.bubble{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:.55em .9em;font-family:var(--display);font-weight:500;font-size:1.12em;max-width:44ch;min-width:0;margin-bottom:28px}
.bubble::before{content:"";position:absolute;left:-16px;bottom:16px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}
.bubble::after{content:"";position:absolute;left:-10px;bottom:18px;border:10px solid transparent;border-right-color:var(--card);border-left:0}
.bubble.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
/* hub */
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;padding-block:10px 24px}
.hero .pw{width:clamp(130px,15vw,230px)}
.hero h1{font-size:clamp(2.2em,4.6vw,4.2em);font-weight:700;letter-spacing:-.01em}
.hero h1 span{color:var(--t6)}
.hero p{margin:.4em 0 0;color:var(--soft);font-size:1.1em}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px}
.door{text-align:left;border:4px solid var(--ink);border-radius:30px;padding:24px 28px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 0 var(--ink);transition:transform .15s;position:relative;overflow:hidden;min-height:260px}
.door:hover{transform:translateY(-4px) rotate(-.4deg)}
.door.d6{background:var(--t6l)} .door.d5{background:var(--t5l)}
.door .lv{font-family:var(--display);font-weight:700;font-size:1em;letter-spacing:.06em;text-transform:uppercase}
.door.d6 .lv{color:var(--t6d)} .door.d5 .lv{color:var(--t5d)}
.door h2{font-size:2.3em;font-weight:700}
.door p{margin:0;color:var(--soft);max-width:30ch}
.door .deco{position:absolute;right:-20px;bottom:-30px;width:210px;opacity:.95;pointer-events:none}
/* niveau */
.lvhead{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-block:6px 18px}
.lvhead h1{font-size:clamp(1.8em,3.4vw,3em)}
.obj{background:var(--card);border:3px dashed var(--line);border-radius:16px;padding:.4em .8em;color:var(--soft)}
.obj b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:18px}
.tile{text-align:left;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center;box-shadow:0 5px 0 var(--ink);transition:transform .12s}
.tile:hover{transform:translateY(-3px)}
.tile .num{flex:none;width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.2em;color:#fff}
.tile.l6 .num{background:var(--t6)} .tile.l5 .num{background:var(--t5)}
.tile .tt{font-family:var(--display);font-weight:600;font-size:1.1em;line-height:1.15}
.tile .ty{font-size:.78em;color:var(--soft)}
.tile .done{font-size:.72em;font-weight:700;color:var(--ok);margin-top:2px}
.tile.retiens{background:var(--okl)}
/* commun activités */
.act h1{font-size:clamp(1.6em,3vw,2.6em)}
.panel{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.win{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
/* journée */
.day{display:grid;grid-template-columns:1.7fr 1fr;gap:20px}
.sky{position:relative;border:4px solid var(--ink);border-radius:26px;overflow:hidden;aspect-ratio:16/9;max-width:100%;transition:background .2s}
.orb{position:absolute;width:12%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)}
.orb.sun{background:#FFD23F;box-shadow:0 0 0 10px #FFD23F55,0 0 60px #FFB300}
.orb.moon{background:#F4F1E0;box-shadow:inset -14px -6px 0 #CFCAB0,0 0 40px #fff8}
.stars{position:absolute;inset:0;transition:opacity .3s;background-image:radial-gradient(2px 2px at 10% 20%,#fff,transparent),radial-gradient(2px 2px at 30% 12%,#fff,transparent),radial-gradient(2px 2px at 52% 28%,#fff,transparent),radial-gradient(2px 2px at 70% 10%,#fff,transparent),radial-gradient(3px 3px at 86% 24%,#fff,transparent),radial-gradient(2px 2px at 42% 8%,#fff,transparent),radial-gradient(2px 2px at 20% 40%,#fff,transparent)}
.hill{position:absolute;left:-10%;right:-10%;bottom:-38%;height:70%;background:#59C27A;border-radius:50%;border-top:4px solid var(--ink)}
.scene-pep{position:absolute;left:50%;bottom:6%;width:17%;transform:translateX(-50%)}
.zz{position:absolute;left:62%;bottom:34%;font-family:var(--display);font-weight:700;color:#fff;font-size:2em;animation:zz 2s infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}50%{opacity:1}100%{opacity:0;transform:translate(30px,-40px)}}
.dayside{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center}
.clock{width:min(100%,260px)}
.dl{font-family:var(--display);font-weight:700;font-size:1.7em}
.ds{color:var(--soft);max-width:24ch}
.dig{font-family:var(--display);font-weight:700;font-size:1.4em;font-variant-numeric:tabular-nums;background:var(--ink);color:#fff;border-radius:12px;padding:.1em .5em}
input[type=range]{width:100%;accent-color:var(--t6);height:34px}
.ticks{display:flex;justify-content:space-between;font-size:.7em;color:var(--soft);font-variant-numeric:tabular-nums}
/* jeu d'ordre */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-bottom:18px}
.slot{min-height:4.6em;border:3px dashed var(--line);border-radius:18px;background:#fff8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center}
.slot .n{font-family:var(--display);font-weight:700;color:var(--soft)}
.slot.filled{border-style:solid;border-color:var(--ok);background:var(--okl);animation:pop .35s}
.slot.filled .n{color:var(--ok)}
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.chip{border:3px solid var(--ink);background:var(--card);border-radius:16px;padding:.45em .8em;font-family:var(--display);font-weight:500;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px}
.chip.gone{visibility:hidden;pointer-events:none}
.chip.sel{background:#FFF1B8;transform:translateY(-4px)}
.fig{width:3.2em;height:auto}
/* durées */
.match{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mi{text-align:left;border:3px solid var(--ink);border-radius:16px;padding:.5em .8em;background:var(--card);font-family:var(--display);font-weight:500;box-shadow:0 4px 0 var(--ink)}
.mi.sel{background:#FFF1B8}
.mi.ok{background:var(--okl);border-color:var(--ok);box-shadow:0 4px 0 var(--ok);pointer-events:none}
.mi .pair{display:block;font-size:.75em;color:var(--ok);font-weight:700}
.hourglass{width:70px}
.sand-top{animation:sandt 4s linear infinite;transform-box:fill-box;transform-origin:bottom}
.sand-bot{animation:sandb 4s linear infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes sandt{0%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes sandb{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
/* agenda */
.tbar{position:relative;height:90px;border:4px solid var(--ink);border-radius:18px;background:repeating-linear-gradient(90deg,#fff 0 calc(100%/9 - 2px),var(--line) calc(100%/9 - 2px) calc(100%/9));display:flex;overflow:hidden}
.seg{height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:.7em;color:#fff;text-align:center;overflow:hidden;border-right:3px solid var(--ink);animation:grow .3s ease;line-height:1.05;padding:2px}
@keyframes grow{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1)}}
.tbar.over{border-color:var(--ko);box-shadow:0 0 0 6px var(--kol)}
.tlab{display:flex;justify-content:space-between;font-size:.72em;color:var(--soft);font-variant-numeric:tabular-nums;margin-top:4px}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px;margin-top:18px}
.blk{border:3px solid var(--ink);border-radius:16px;padding:.5em .7em;text-align:left;background:var(--card);box-shadow:0 4px 0 var(--ink);display:flex;justify-content:space-between;gap:8px;align-items:center}
.blk .d{font-size:.8em;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.blk.on{color:#fff}
.blk.on .d{color:#fffd}
.left{font-family:var(--display);font-weight:700;font-size:1.3em}
/* fêtes frise */
.frise-wrap{overflow-x:auto;border:4px solid var(--ink);border-radius:22px;background:var(--card)}
.frise{position:relative;min-width:1100px;padding:0 0 10px 150px}
.months{display:grid;grid-template-columns:repeat(12,1fr);position:sticky;top:0}
.months div{font-family:var(--display);font-weight:600;text-align:center;padding:8px 0;border-left:2px solid var(--line);font-size:.85em}
.months div:nth-child(odd){background:#F2F7FF}
.frow{position:relative;border-top:2px solid var(--line)}
.frow .rl{position:absolute;left:-150px;width:140px;top:0;bottom:0;display:flex;align-items:center;padding-left:12px;font-family:var(--display);font-weight:700;font-size:.85em}
.fchip{position:absolute;transform:translateX(-50%);border:3px solid var(--ink);border-radius:999px;padding:.15em .6em;font-family:var(--display);font-weight:600;font-size:.78em;color:#fff;white-space:nowrap;transition:left 1.2s cubic-bezier(.5,0,.2,1),transform .2s;animation:drop .6s backwards}
.fchip:hover,.fchip.hl{transform:translateX(-50%) scale(1.18);z-index:3;box-shadow:0 0 0 6px #FFD23F}
@keyframes drop{from{opacity:0;transform:translate(-50%,-40px)}}
.today{position:absolute;top:0;bottom:0;width:4px;background:var(--ko);z-index:2}
.today span{position:absolute;top:-2px;left:6px;background:var(--ko);color:#fff;font-size:.62em;font-weight:700;padding:1px 6px;border-radius:6px;white-space:nowrap}
.finfo{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:16px;min-height:6em}
.finfo .pw{width:100px}
.tag{display:inline-block;color:#fff;border-radius:999px;padding:.05em .6em;font-size:.75em;font-weight:700;font-family:var(--display)}
.moonrow{display:flex;gap:6px;align-items:center}
.moonrow i{width:22px;height:22px;border-radius:50%;background:#2A2F6B;display:block;position:relative;overflow:hidden}
.moonrow i::after{content:"";position:absolute;inset:0;border-radius:50%;background:#F4E9A8;transform:translateX(var(--m))}
/* tri */
.bins{display:grid;gap:12px;margin-top:18px}
.bin{border:4px solid var(--c);border-radius:20px;background:color-mix(in srgb,var(--c) 10%,#fff);padding:10px;min-height:5em;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:center}
.bin h3{color:var(--c);font-size:1em}
.bin .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bin .in span{background:var(--c);color:#fff;border-radius:10px;padding:.1em .5em;font-size:.75em;font-family:var(--display);animation:pop .3s}
.bin.armed{box-shadow:0 0 0 6px #FFD23F}
.deck{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:3em}
/* vrai faux */
.vf{max-width:900px;margin:0 auto;text-align:center}
.vf .q{font-family:var(--display);font-weight:600;font-size:1.8em;min-height:3em;display:grid;place-items:center}
.vf .ans{display:flex;gap:20px;justify-content:center;margin:16px 0}
.vf .ans .btn{font-size:1.5em;min-width:6em}
.vf .ans .v{background:var(--okl)} .vf .ans .f{background:var(--kol)}
.vf .ex{min-height:2.4em;font-size:1.1em}
.dots{display:flex;gap:8px;justify-content:center;margin-top:10px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line);display:block}
.dots i.g{background:var(--ok)} .dots i.b{background:var(--ko)}
/* retiens */
.ret{display:flex;flex-direction:column;gap:14px;max-width:1000px}
.ret li{list-style:none;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:.6em 1em;font-family:var(--display);font-weight:500;font-size:1.3em;animation:slidein .45s backwards;display:flex;gap:14px;align-items:center}
.ret li b{flex:none;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;color:#fff}
@keyframes slidein{from{opacity:0;transform:translateX(-40px)}}
.ret ul{padding:0;margin:0;display:flex;flex-direction:column;gap:14px}
/* cercles */
.circ-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center}
.circles{position:relative;width:min(100%,560px);aspect-ratio:1;margin:0 auto}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:5px dashed var(--t5);transform:translate(-50%,-50%);transition:width .9s cubic-bezier(.4,1.4,.5,1),height .9s cubic-bezier(.4,1.4,.5,1),border-color .5s;background:color-mix(in srgb,var(--t5) 7%,transparent)}
.cf{position:absolute;width:13%;transform:translate(-50%,-50%) scale(1);transition:left .9s cubic-bezier(.4,1.3,.5,1),top .9s cubic-bezier(.4,1.3,.5,1),opacity .5s,transform .5s}
.cf.hide{opacity:0;transform:translate(-50%,-50%) scale(.2)}
.cmid{position:absolute;left:50%;top:50%;width:20%;transform:translate(-50%,-55%)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cmp .c{border:3px solid var(--ink);border-radius:18px;padding:12px;background:var(--card);transition:transform .3s,opacity .3s;opacity:.45}
.cmp .c.on{opacity:1;transform:scale(1.03);box-shadow:0 6px 0 var(--ink)}
.cmp h3{font-size:1.3em;margin-bottom:6px}
.cmp ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.devise{font-family:var(--display);font-weight:700;letter-spacing:.04em;text-align:center;font-size:1.2em;margin-top:12px}
.devise span{color:var(--t5)}
/* pierres */
.walk{position:relative;height:340px;border:4px solid var(--ink);border-radius:24px;overflow:hidden;background:linear-gradient(#AEE1FF,#E7F6FF 70%)}
.ground{position:absolute;left:0;right:0;bottom:0;height:70px;background:repeating-linear-gradient(90deg,#7BC96F 0 60px,#68B85C 60px 120px);border-top:4px solid var(--ink);animation:scroll var(--spd,1s) linear infinite}
@keyframes scroll{from{background-position:0 0}to{background-position:-120px 0}}
.walker{position:absolute;left:38%;bottom:56px;width:150px;animation:bob var(--bob,.5s) ease-in-out infinite}
.bag{position:absolute;left:-46%;bottom:14%;width:calc(40px + var(--n,0)*22px);aspect-ratio:1;background:#9A6B3F;border:4px solid var(--ink);border-radius:30% 30% 22% 22%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;transition:width .4s}
.cloud{position:absolute;width:120px;height:40px;background:#fff;border-radius:40px;animation:cloud linear infinite}
@keyframes cloud{from{transform:translateX(900px)}to{transform:translateX(-200px)}}
.stones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;margin-top:16px}
.stone{border:3px solid var(--ink);background:#C8C1B6;border-radius:40% 50% 45% 55%/55% 45% 55% 45%;padding:.7em 1em;font-family:var(--display);font-weight:600;box-shadow:0 5px 0 var(--ink)}
.stone.gone{opacity:.25;pointer-events:none;background:var(--okl);text-decoration:line-through}
.fly{position:absolute;width:44px;height:36px;background:#8E8578;border:3px solid var(--ink);border-radius:45%;z-index:5;animation:fly 1s ease-in forwards}
@keyframes fly{to{transform:translate(-160px,180px) rotate(-200deg);opacity:0}}
.meter{height:26px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;flex:1;min-width:160px}
.meter div{height:100%;background:repeating-linear-gradient(45deg,#8E8578 0 12px,#A59C8F 12px 24px);transition:width .5s}
/* pont */
.bridge{position:relative;height:300px;border:4px solid var(--ink);border-radius:24px;overflow:hidden;background:linear-gradient(#BFE6FF,#EAF7FF)}
.cliff{position:absolute;bottom:0;width:26%;height:46%;background:#8A6A4A;border-top:10px solid #59C27A}
.cliff.l{left:0;border-right:4px solid var(--ink)} .cliff.r{right:0;border-left:4px solid var(--ink)}
.river{position:absolute;left:26%;right:26%;bottom:0;height:22%;background:repeating-linear-gradient(90deg,#3FA3E8 0 30px,#56B3EF 30px 60px);animation:scroll 2s linear infinite}
.planks{position:absolute;left:26%;right:26%;bottom:46%;height:22px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.plank{background:#C8873E;border:3px solid var(--ink);border-radius:4px;opacity:0;transform:translateY(-200px)}
.plank.in{opacity:1;transform:none;transition:transform .55s cubic-bezier(.3,1.5,.6,1),opacity .2s}
.bp{position:absolute;bottom:46%;width:13%;transition:left 1.8s ease-in-out}
/* --- couche ludique --- */
.wrap{position:relative;z-index:1}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;aspect-ratio:1;opacity:.18;background:var(--c);animation:drift ease-in-out infinite alternate}
.fl.ring{background:none;border:6px solid var(--c);border-radius:50%}
.fl.dot{border-radius:50%}
.fl.star,.pt.star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.fl.heart,.pt.heart{clip-path:polygon(50% 92%,10% 52%,3% 32%,12% 12%,30% 6%,50% 22%,70% 6%,88% 12%,97% 32%,90% 52%)}
@keyframes drift{from{transform:translate(0,0) rotate(0)}to{transform:translate(60px,-90px) rotate(160deg)}}
.pep .pup{transform:translate(calc(var(--ex,0)*1px),calc(var(--ey,0)*1px));transition:transform .12s}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.pt{position:absolute;width:var(--s,12px);height:var(--s,12px);margin:calc(var(--s,12px)/-2) 0 0 calc(var(--s,12px)/-2);background:var(--c);border-radius:50%;animation:ptk var(--d,.9s) cubic-bezier(.2,.7,.4,1) forwards}
.pt.star,.pt.heart{border-radius:0}
.pt.glow{box-shadow:0 0 14px 4px var(--c)}
.pt.snow{background:#fff;border:2px solid #9FC4F0;animation-timing-function:linear}
@keyframes ptk{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r,0deg));opacity:0}}
.plus{position:absolute;font-family:var(--display);font-weight:700;font-size:2.2em;color:var(--ok);-webkit-text-stroke:2px #fff;paint-order:stroke;transform:translate(-50%,-50%);animation:plus .9s ease-out forwards}
@keyframes plus{to{translate:0 -80px;opacity:0;scale:1.4}}
.dizzy{animation:dizzy .6s}
@keyframes dizzy{25%{transform:rotate(-14deg) scale(.95)}75%{transform:rotate(14deg) scale(.95)}}
.sb{font-family:var(--display);font-weight:700;background:#FFF1B8;border:3px solid var(--ink);border-radius:14px;padding:.2em .6em;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.sb.bump{animation:pop .4s}
.act{animation:enter .45s ease}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.98)}}
.tile:hover .num{animation:spin .6s}
@keyframes spin{50%{transform:rotate(180deg) scale(1.25)}100%{transform:rotate(360deg)}}
.hero .pw,#bpep{cursor:pointer}
.vf .q.in{animation:qin .45s cubic-bezier(.3,1.5,.6,1)}
@keyframes qin{from{opacity:0;transform:scale(.6) rotate(-5deg)}}
/* journée : décor */
.dcloud{position:absolute;width:16%;height:7%;background:#fff;border-radius:99px;animation:cloud2 linear infinite;opacity:.9;transition:opacity .6s}
.dcloud::before{content:"";position:absolute;width:50%;height:170%;left:20%;bottom:20%;background:inherit;border-radius:50%}
@keyframes cloud2{from{left:105%}to{left:-25%}}
.sky.night .dcloud{opacity:.1}
.birds{position:absolute;top:22%;width:9%;animation:birds 13s linear infinite;transition:opacity .5s}
@keyframes birds{from{left:-12%}50%{translate:0 -24px}to{left:110%}}
.sky.night .birds{opacity:0}
.house{position:absolute;left:10%;bottom:20%;width:17%;aspect-ratio:1.1;background:#FFE3CC;border:4px solid var(--ink);border-radius:6px}
.house::before{content:"";position:absolute;left:-16%;right:-16%;bottom:100%;height:62%;background:#E5394F;clip-path:polygon(50% 0,100% 100%,0 100%)}
.hw{position:absolute;width:26%;height:28%;top:18%;background:#BFE6FF;border:3px solid var(--ink);transition:background .4s,box-shadow .4s}
.hw.a{left:10%}.hw.b{right:10%}
.door2{position:absolute;bottom:0;left:38%;width:24%;height:44%;background:#8A5A2B;border:3px solid var(--ink);border-bottom:0}
.sky.night .hw{background:#FFD23F;box-shadow:0 0 18px #FFD23F}
.shoot{position:absolute;top:10%;left:72%;width:90px;height:3px;background:linear-gradient(90deg,#fff,transparent);opacity:0;rotate:-25deg}
.sky.night .shoot{animation:shoot 5s ease-in infinite}
@keyframes shoot{0%,80%{opacity:0;translate:0 0}85%{opacity:1}100%{opacity:0;translate:-320px 130px}}
.prop{position:absolute;left:62%;bottom:10%;width:10%;animation:propin .5s cubic-bezier(.3,1.6,.6,1)}
.prop svg{width:100%;height:auto;animation:bob 1.2s ease-in-out infinite}
@keyframes propin{from{transform:scale(0) rotate(-40deg)}}
/* arcade */
.arena{position:relative;height:min(64vh,580px);border:4px solid var(--ink);border-radius:24px;overflow:hidden;background:linear-gradient(#DDEBFF,#F5F9FF);transition:background 1.2s}
.hud{position:absolute;top:0;left:0;right:0;display:flex;gap:12px;align-items:center;padding:10px 14px;z-index:3;flex-wrap:wrap}
.tgt{font-family:var(--display);font-weight:700;font-size:1.35em;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:.1em .6em}
.tm{flex:1;min-width:120px;height:18px;border:3px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.tm i{display:block;height:100%;width:100%;background:var(--t6)}
.arena.up .tm i{background:var(--t5)}
.go{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:4;font-size:1.5em!important}
.fall{position:absolute;left:0;top:0;border:3px solid var(--ink);background:#fff;border-radius:999px;padding:.45em 1em;font-family:var(--display);font-weight:600;box-shadow:0 4px 0 var(--ink);white-space:nowrap;z-index:2}
.fall:hover{background:#FFF1B8}
.popok{animation:popok .3s forwards;background:var(--okl)!important}
.popko{animation:popok .35s forwards;background:var(--kol)!important}
@keyframes popok{to{scale:1.6;opacity:0}}
.chain{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;align-items:flex-end;z-index:1;padding:0 10px}
.chain::before{content:"";position:absolute;left:12%;right:12%;bottom:42%;height:6px;background:var(--t5);border-radius:3px;opacity:.4}
.lk{width:min(9%,84px);animation:dance .7s ease-in-out infinite alternate,pop .45s;position:relative}
.lk:nth-child(even){animation-delay:-.35s,0s}
@keyframes dance{from{translate:0 0;rotate:-4deg}to{translate:0 -12px;rotate:4deg}}
/* confetti */
#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (max-width:820px){
  .day,.circ-grid,.match{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;justify-items:start}
  .cmp{grid-template-columns:1fr}
  .walker{width:110px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>

</head>
<body>
<div class="bgfx" aria-hidden="true"></div>
<div class="wrap">
  <header class="bar">
    <button class="btn" id="back" hidden>Retour</button>
    <div class="ttl" id="ttl">L'atelier de Pépin</div>
    <span class="sb" id="sb" title="Étoiles gagnées"><svg viewBox="0 0 24 24" width="1.1em" aria-hidden="true"><path d="M12 2l3 7h7l-5.6 4.3 2.1 7.2L12 16.3 5.5 20.5l2.1-7.2L2 9h7z" fill="#FFC93C" stroke="#1A2347" stroke-width="1.5"/></svg><b>0</b></span>
    <button class="btn sm" id="snd" aria-pressed="true">Son : oui</button>
    <button class="btn sm" id="fs">Plein écran</button>
  </header>
  <main id="app"></main>
</div>
<canvas id="cf"></canvas>
<div id="fx"></div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const app=$('#app');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- son, confettis, progression ---------- */
let sound=true,AC=null;
function tone(ok){if(!sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';
 if(ok){o.frequency.setValueAtTime(620,t);o.frequency.setValueAtTime(930,t+.09)}else{o.frequency.setValueAtTime(240,t);o.frequency.setValueAtTime(170,t+.12)}
 g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.34)}catch(e){}}
function fanfare(){if(!sound)return;[523,659,784,1046].forEach((f,i)=>setTimeout(()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.26)}catch(e){}},i*120))}
$('#snd').onclick=e=>{sound=!sound;e.target.textContent='Son : '+(sound?'oui':'non');e.target.setAttribute('aria-pressed',sound)};
$('#fs').onclick=()=>{try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();p&&p.catch&&p.catch(()=>{})}catch(e){}};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(){if(reduce)return;const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const cols=['#FF7A1A','#7C4DFF','#0E9E6E','#FFC93C','#E5394F','#2F68E8'];
 const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6,s:6+Math.random()*8,c:cols[Math.random()*6|0]}));
 const t0=performance.now();(function f(t){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
 if(t-t0<3200)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(t0)}
let done={};try{done=JSON.parse(localStorage.getItem('pepin-done')||'{}')}catch(e){}
function markDone(id){done[id]=1;try{localStorage.setItem('pepin-done',JSON.stringify(done))}catch(e){}}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}

/* ---------- effets ludiques ---------- */
let lastP={x:innerWidth/2,y:innerHeight/2};
addEventListener('pointerdown',e=>{lastP={x:e.clientX,y:e.clientY}},true);
let starsN=0;try{starsN=+localStorage.getItem('pepin-stars')||0}catch(e){}
const updStars=bump=>{const b=$('#sb');$('b',b).textContent=starsN;if(bump){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}};
function burst(x,y,{n=12,shape='',cols=['#FFC93C'],spread=120,dur=.9,size=[8,16],up=0}={}){if(reduce)return;const fx=$('#fx');
 for(let i=0;i<n;i++){const d=document.createElement('i');d.className='pt '+shape;const a=Math.random()*Math.PI*2,r=spread*(.35+Math.random()*.65);
  d.style.cssText=`left:${x}px;top:${y}px;--c:${cols[i%cols.length]};--s:${(size[0]+Math.random()*(size[1]-size[0])).toFixed(0)}px;--dx:${(Math.cos(a)*r).toFixed(0)}px;--dy:${(Math.sin(a)*r-up).toFixed(0)}px;--r:${(Math.random()*400-200).toFixed(0)}deg;--d:${dur}s`;
  fx.appendChild(d);setTimeout(()=>d.remove(),dur*1000+80)}}
function plus(x,y,t='+1'){if(reduce)return;const d=document.createElement('div');d.className='plus';d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';$('#fx').appendChild(d);setTimeout(()=>d.remove(),950)}
function snow(){if(reduce)return;const fx=$('#fx');for(let i=0;i<46;i++){const d=document.createElement('i');d.className='pt snow';const dur=2.4+Math.random()*2;
 d.style.cssText=`left:${Math.random()*innerWidth}px;top:-20px;--s:${8+Math.random()*12}px;--dx:${Math.random()*80-40}px;--dy:${innerHeight+40}px;--d:${dur}s;animation-delay:${Math.random()*1.2}s`;fx.appendChild(d);setTimeout(()=>d.remove(),(dur+1.4)*1000)}}
function beep(ok,fx=1){tone(ok);if(!fx)return;
 if(ok){burst(lastP.x,lastP.y,{n:14,shape:'star',cols:['#FFC93C','#FF7A1A','#7C4DFF','#0E9E6E'],size:[12,22]});plus(lastP.x,lastP.y);starsN++;try{localStorage.setItem('pepin-stars',starsN)}catch(e){}updStars(1)}
 else{const p=$('#bpep');if(p){p.classList.remove('dizzy');void p.offsetWidth;p.classList.add('dizzy')}}}
document.addEventListener('animationend',e=>{if(e.animationName==='dizzy'||e.animationName==='hop')e.target.classList.remove('dizzy','hop')});
let eyeRaf=0;addEventListener('pointermove',e=>{if(eyeRaf)return;eyeRaf=requestAnimationFrame(()=>{eyeRaf=0;const r=document.documentElement.style;r.setProperty('--ex',((e.clientX/innerWidth-.5)*7).toFixed(1));r.setProperty('--ey',((e.clientY/innerHeight-.5)*6).toFixed(1))})});
const JOKES=['Hé, ça chatouille !','Je suis un pépin… mais pas un problème !','Tic-tac, tic-tac : j\'ai le hoquet du temps !','Un pépin, ça pousse. Comme vous !','Encore un clic et je fais une pirouette !','Chut… j\'écoute le temps passer.'];
document.addEventListener('click',e=>{const p=e.target.closest('#bpep');if(!p)return;tone(1);say(JOKES[Math.random()*JOKES.length|0],'wow');const r=p.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/3,{n:10,shape:'heart',cols:['#FF8FA3','#E5394F'],spread:90,up:40,size:[12,20]})});
(function(){const g=$('.bgfx'),sh=['ring','star','heart','dot'],cols=['#FF7A1A','#7C4DFF','#0E9E6E','#FFC93C','#2F68E8','#E5394F'];
 for(let i=0;i<16;i++){const d=document.createElement('i');d.className='fl '+sh[i%4];d.style.cssText=`left:${Math.random()*96}%;top:${Math.random()*96}%;--c:${cols[i%6]};width:${22+Math.random()*44}px;animation-duration:${16+Math.random()*18}s;animation-delay:-${(Math.random()*20).toFixed(1)}s`;g.appendChild(d)}})();

/* ---------- Pépin ---------- */
function pepin(mood='happy',col='#FFC93C',leaf='#2FB36B'){
 const M={happy:'M47 87 Q60 100 73 87',sad:'M48 94 Q60 84 72 94',flat:'M50 91 L70 91'};
 const mouth=mood==='wow'?'<ellipse cx="60" cy="91" rx="7" ry="9" fill="#7A2B2B" stroke="#3A2A10" stroke-width="2"/>'
   :`<path d="${M[mood]||M.happy}" stroke="#3A2A10" stroke-width="4.5" fill="none" stroke-linecap="round"/>`;
 const eyes=mood==='sleep'
  ?'<path d="M36 68 Q44 74 52 68 M68 68 Q76 74 84 68" stroke="#3A2A10" stroke-width="4" fill="none" stroke-linecap="round"/>'
  :`<g class="eyes"><circle cx="44" cy="66" r="11" fill="#fff" stroke="#3A2A10" stroke-width="2.5"/><circle cx="76" cy="66" r="11" fill="#fff" stroke="#3A2A10" stroke-width="2.5"/><g class="pup"><circle cx="46" cy="68" r="5.5" fill="#1A2347"/><circle cx="78" cy="68" r="5.5" fill="#1A2347"/><circle cx="48" cy="65" r="2" fill="#fff"/><circle cx="80" cy="65" r="2" fill="#fff"/></g></g>`;
 const brows=mood==='sad'?'<path d="M33 50 L52 55 M87 50 L68 55" stroke="#3A2A10" stroke-width="3.5" stroke-linecap="round"/>':'';
 return `<svg class="pep" viewBox="0 0 120 136" aria-hidden="true">
  <path d="M60 31 C57 15 66 5 80 3 C80 17 71 27 60 31Z" fill="${leaf}" stroke="#3A2A10" stroke-width="2.5"/>
  <path d="M60 31 C52 22 42 20 36 22 C42 30 52 33 60 31Z" fill="${leaf}" stroke="#3A2A10" stroke-width="2.5"/>
  <ellipse cx="44" cy="128" rx="13" ry="6" fill="#F08A24" stroke="#3A2A10" stroke-width="2.5"/><ellipse cx="76" cy="128" rx="13" ry="6" fill="#F08A24" stroke="#3A2A10" stroke-width="2.5"/>
  <ellipse cx="60" cy="77" rx="46" ry="48" fill="${col}" stroke="#3A2A10" stroke-width="3"/>
  <ellipse cx="60" cy="96" rx="25" ry="18" fill="#fff" opacity=".35"/>
  <path d="M16 82 Q4 74 8 62" stroke="#3A2A10" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M104 82 Q116 74 112 62" stroke="#3A2A10" stroke-width="4" fill="none" stroke-linecap="round"/>
  ${eyes}${brows}
  <circle cx="31" cy="84" r="6.5" fill="#FF8FA3" opacity=".75"/><circle cx="89" cy="84" r="6.5" fill="#FF8FA3" opacity=".75"/>
  ${mouth}</svg>`;
}
function buddy(text,mood='happy'){return `<div class="buddy"><div class="pw bob" id="bpep">${pepin(mood)}</div><div class="bubble" id="say">${text}</div></div>`}
let tyT=null;
function say(text,mood){const b=$('#say');if(!b)return;clearInterval(tyT);const s=String(text);
 if(reduce)b.textContent=s;else{let i=0;b.textContent='';tyT=setInterval(()=>{i+=2;b.textContent=s.slice(0,i);if(i>=s.length)clearInterval(tyT)},16)}b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
 if(mood){const p=$('#bpep');p.innerHTML=pepin(mood);if(mood==='happy'||mood==='wow'){p.classList.remove('hop');void p.offsetWidth;p.classList.add('hop')}}}
function win(el,id,msg,replay){markDone(id);confetti();fanfare();say(msg,'happy');
 const w=document.createElement('div');w.className='win';w.innerHTML=`<button class="btn big">Rejouer</button><button class="btn big ${LV[id]===6?'p6':'p5'}">Activité suivante</button>`;
 el.appendChild(w);w.children[0].onclick=replay;w.children[1].onclick=()=>{const list=LIST[LV[id]],i=list.findIndex(a=>a.id===id);location.hash=list[i+1]?list[i+1].id:(LV[id]===6?'sixieme':'cinquieme')}}

/* petit personnage pour les âges */
function person(st){
 const H=[34,52,70,92,100,94][st],hair=st===5?'#B9B9B9':['#6B4226','#3B2A1A','#C9772E','#2A1A10','#6B4226','#B9B9B9'][st];
 const skin=['#F7C8A0','#E8B48A','#B5835A','#8D5B3A','#F2C29A','#E8B48A'][st];
 const y0=110-H;const head=Math.max(14,H*.2);
 return `<svg class="fig" viewBox="0 0 60 112" aria-hidden="true">
  <rect x="${30-H*.14}" y="${y0+head*1.8}" width="${H*.28}" height="${H-head*1.8}" rx="8" fill="${['#FFB3C7','#7AC8FF','#FF9F43','#7C4DFF','#2F68E8','#8EA0B8'][st]}" stroke="#1A2347" stroke-width="2.5"/>
  <circle cx="30" cy="${y0+head}" r="${head}" fill="${skin}" stroke="#1A2347" stroke-width="2.5"/>
  <path d="M${30-head} ${y0+head} A${head} ${head} 0 0 1 ${30+head} ${y0+head}" fill="${hair}" stroke="#1A2347" stroke-width="2.5"/>
  ${st===5?`<path d="M${30+H*.22} ${y0+head*2.2} L${30+H*.22} 110" stroke="#7A4A20" stroke-width="4" stroke-linecap="round"/>`:''}
 </svg>`;
}

/* ---------- moteurs de jeu ---------- */
function orderGame(host,items,{onStep,onDone}={}){
 const pool=shuffle(items.map((t,i)=>({t,i})));
 host.innerHTML=`<div class="slots">${items.map((_,i)=>`<div class="slot" data-i="${i}"><span class="n">${i+1}</span><span class="st"></span></div>`).join('')}</div>
  <div class="pool">${pool.map(o=>`<button class="chip" data-i="${o.i}">${o.t}</button>`).join('')}</div>`;
 let next=0;
 $$('.chip',host).forEach(b=>b.onclick=()=>{
  if(+b.dataset.i===next){beep(1);const s=$(`.slot[data-i="${next}"]`,host);s.classList.add('filled');$('.st',s).innerHTML=b.innerHTML;b.classList.add('gone');next++;onStep&&onStep(next);if(next===items.length)onDone&&onDone()}
  else{beep(0);shake(b);say('Pas encore celui-là. Qu\'est-ce qui vient avant ?','sad')}
 });
}
function sortGame(host,cards,cats,{onDone,cols}={}){
 host.innerHTML=`<div class="deck">${shuffle(cards).map(c=>`<button class="chip" data-c="${c.c}">${c.t}</button>`).join('')}</div>
  <div class="bins" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,${cols||200}px),1fr))">${cats.map(k=>`<div class="bin" role="button" tabindex="0" data-k="${k.id}" style="--c:${k.col}"><h3>${k.label}</h3><div class="in"></div></div>`).join('')}</div>`;
 let sel=null,left=cards.length;
 $$('.chip',host).forEach(b=>b.onclick=()=>{$$('.chip',host).forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');$$('.bin',host).forEach(x=>x.classList.add('armed'))});
 $$('.bin',host).forEach(bin=>{const go=()=>{if(!sel)return;
  if(sel.dataset.c===bin.dataset.k){beep(1);$('.in',bin).insertAdjacentHTML('beforeend',`<span>${sel.textContent}</span>`);sel.remove();sel=null;left--;$$('.bin',host).forEach(x=>x.classList.remove('armed'));say(['Oui !','Bien vu !','Exact !','Parfait !'][Math.random()*4|0],'happy');if(!left)onDone&&onDone()}
  else{beep(0);shake(sel);shake(bin);say('Essaie une autre boîte.','sad')}};
  bin.onclick=go;bin.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
}
function vfGame(host,qs,{onDone}={}){

function arcade(el,{dur,every,rise,pick,onClick,onTick,onEnd,onStart}){
 const ar=$('#ar',el);let raf=0,t0=0,last=0,items=[],running=false;
 const clear=()=>{items.forEach(b=>b.el.remove());items=[]};
 const spawn=()=>{const it=pick();const d=document.createElement('button');d.className='fall';d.textContent=it.t;ar.appendChild(d);
  const W=Math.max(10,ar.clientWidth-d.offsetWidth-10),H=ar.clientHeight;const b={el:d,it,x:5+Math.random()*W,y:rise?H:-50,v:(1.3+Math.random()*1.3)*(H/520)};
  d.style.transform=`translate(${b.x}px,${b.y}px)`;items.push(b);
  d.onclick=()=>{if(b.dead)return;b.dead=1;const ok=onClick(b.it);d.classList.add(ok?'popok':'popko');setTimeout(()=>d.remove(),360)}};
 const loop=t=>{const e=t-t0;$('#tb',el).style.width=Math.max(0,100-e/dur*100)+'%';onTick&&onTick(e);
  if(e-last>every){last=e;spawn()}const H=ar.clientHeight;
  items.forEach(b=>{if(b.dead)return;b.y+=rise?-b.v:b.v;b.el.style.transform=`translate(${b.x}px,${b.y}px)`;if(rise?b.y<40:b.y>H){b.dead=1;b.el.remove()}});
  items=items.filter(b=>!b.dead||b.el.isConnected);
  if(running&&e<dur)raf=requestAnimationFrame(loop);else stop()};
 const stop=()=>{if(!running)return;running=false;cancelAnimationFrame(raf);clear();$('#go',el).hidden=false;$('#go',el).textContent='Rejouer';onEnd()};
 const start=()=>{$$('.win',el).forEach(w=>w.remove());clear();$('#go',el).hidden=true;onStart();running=true;t0=performance.now();last=-1e9;raf=requestAnimationFrame(loop)};
 $('#go',el).onclick=start;
 return{stop,cleanup:()=>{running=false;cancelAnimationFrame(raf)},start};
}

   <svg class="deco" viewBox="0 0 200 200" aria-hidden="true"><g><animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite"/>${FCOL.slice(0,8).map((c,i)=>{const a=i/8*Math.PI*2;return`<circle cx="${100+66*Math.cos(a)}" cy="${100+66*Math.sin(a)}" r="18" fill="${c}" stroke="#1A2347" stroke-width="4"/>`}).join('')}</g><circle cx="100" cy="100" r="66" fill="none" stroke="#7C4DFF" stroke-width="5" stroke-dasharray="10 8"/><path d="M100 128 C70 108 74 80 92 82 C98 82 100 88 100 92 C100 88 102 82 108 82 C126 80 130 108 100 128Z" fill="#E5394F" stroke="#1A2347" stroke-width="4"/></svg></button></div>`;
 const msgs=['Salut ! Je suis Pépin. On joue et on apprend ensemble ?','Choisis ta classe pour commencer.','Le temps file… et l\'amitié reste !'];let k=0;
 const t=setInterval(()=>{k=(k+1)%msgs.length;say(msgs[k],'happy')},5000);return()=>clearInterval(t);
}
function vLevel(el,lv){
 const L=LIST[lv];
 el.innerHTML=`<div class="lvhead"><h1>${lv===6?'6e : Le temps':'5e : Fraternité et pardon'}</h1>
 <div class="obj"><b>Objectif :</b> ${lv===6?'comprendre le rythme du temps, s\'organiser, connaître les fêtes des religions.':'distinguer amitié et fraternité, comprendre ce qu\'est pardonner.'}</div></div>
 ${buddy(lv===6?'Tic-tac ! Suis les étapes dans l\'ordre, ou choisis une activité.':'Prêts à ouvrir grand le cercle ? Choisis une activité.')}
 <div class="tiles">${L.map((a,i)=>`<button class="tile l${lv} ${a.id.startsWith('retiens')?'retiens':''}" onclick="location.hash='${a.id}'"><span class="num">${i+1}</span><span><span class="tt">${a.t}</span><br><span class="ty">${a.y}</span>${done[a.id]?'<div class="done">Fait</div>':''}</span></button>`).join('')}</div>`;
}
let cleanup=null;
function route(){
 cleanup&&cleanup();cleanup=null;const h=location.hash.slice(1)||'hub';const back=$('#back');
 app.innerHTML='';const el=document.createElement('section');el.className='act';app.appendChild(el);
 if(h==='sixieme'||h==='cinquieme'){const lv=h==='sixieme'?6:5;vLevel(el,lv);back.hidden=false;back.onclick=()=>location.hash='';$('#ttl').textContent=lv===6?'6e · Le temps':'5e · Fraternité et pardon'}
 else if(LV[h]){const lv=LV[h],a=LIST[lv].find(x=>x.id===h);cleanup=a.f(el)||null;back.hidden=false;back.onclick=()=>location.hash=lv===6?'sixieme':'cinquieme';$('#ttl').textContent=(lv===6?'6e':'5e')+' · '+a.t}
 else{cleanup=vHub(el);back.hidden=true;$('#ttl').textContent='L\'atelier de Pépin'}
 window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
